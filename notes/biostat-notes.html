        /* Distinct Biostatistics Theme Hero Section (Deep Indigo / Slate) */
        .hero-section {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #3730a3);
            color: #ffffff;
            padding: 90px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -10px 30px rgba(0, 0, 0, 0.15);
        }
        .hero-section::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(129, 140, 248, 0.25) 0%, transparent 60%);
            pointer-events: none;
        }
        
        .card-custom {
            border: none;
            border-radius: 12px;
            background: #ffffff;

            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }
        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }
        .card-body-content {
            padding: 28px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
